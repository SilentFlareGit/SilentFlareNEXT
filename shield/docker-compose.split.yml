x-shield-common: &shield-common
  build:
    context: .
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - shield-data:/app/data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 15s

services:
  migrate:
    <<: *shield-common
    restart: "no"
    command: ["python", "-m", "app.migrate"]

  gateway:
    <<: *shield-common
    command: ["uvicorn", "app.gateway.app:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips", "127.0.0.1"]
    ports:
      - "127.0.0.1:9080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  control:
    <<: *shield-common
    command: ["uvicorn", "app.control.app:app", "--host", "0.0.0.0", "--port", "8082", "--proxy-headers", "--forwarded-allow-ips", "127.0.0.1"]
    ports:
      - "127.0.0.1:9082:8082"
    depends_on:
      migrate:
        condition: service_completed_successfully

  portal:
    <<: *shield-common
    command: ["uvicorn", "app.portal.app:app", "--host", "0.0.0.0", "--port", "8083", "--proxy-headers", "--forwarded-allow-ips", "127.0.0.1"]
    ports:
      - "127.0.0.1:9083:8083"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *shield-common
    command: ["python", "-m", "app.worker.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
	shield-data:
