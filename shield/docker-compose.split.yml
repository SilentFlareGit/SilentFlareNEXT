x-shield-common: &shield-common
  build:
    context: .
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - shield-data:/app/data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 15s

services:
  migrate:
    <<: *shield-common
    restart: "no"
    command: ["python", "-m", "app.migrate"]

  gateway:
    <<: *shield-common
    command: ["uvicorn", "app.gateway.app:app", "--host", "0.0.0.0", "--port", "8080", "--no-proxy-headers"]
    ports:
      - "127.0.0.1:9080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  control:
    <<: *shield-common
    command: ["uvicorn", "app.control.app:app", "--host", "0.0.0.0", "--port", "8082", "--no-proxy-headers"]
    ports:
      - "127.0.0.1:9082:8082"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/__shield/health/live', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  portal:
    <<: *shield-common
    command: ["uvicorn", "app.portal.app:app", "--host", "0.0.0.0", "--port", "8083", "--no-proxy-headers"]
    ports:
      - "127.0.0.1:9083:8083"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/__shield/health/live', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  worker:
    <<: *shield-common
    command: ["python", "-m", "app.worker.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

volumes:
  shield-data:
