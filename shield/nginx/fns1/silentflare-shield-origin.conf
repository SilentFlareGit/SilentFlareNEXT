# Internal origins. Only Shield and the explicit blog fail-open route use this listener.
server {
	listen 127.0.0.1:9081;
	server_name blog.silentflare.com;
	root /opt/silentflare/blog/current;
	index index.html;

	location / {
		try_files $uri $uri/ /404.html;
	}

	location ~* \.(?:css|js|mjs|json|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?)$ {
		try_files $uri =404;
		access_log off;
		expires 30d;
		add_header Cache-Control "public, max-age=2592000, immutable";
	}
}

server {
	listen 127.0.0.1:9081;
	server_name accounts.silentflare.com;
	root /opt/silentflare/blog/current;
	index index.html;

	location = / {
		try_files /accounts/index.html =404;
	}

	location /accounts-api/ {
		proxy_pass http://127.0.0.1:9010/;
		proxy_http_version 1.1;
		proxy_set_header Host api.silentflare.com;
		proxy_set_header X-Real-IP $http_x_real_ip;
		proxy_set_header X-Forwarded-For $http_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
	}

	location / {
		try_files $uri $uri/ /404.html;
	}
}

server {
	listen 127.0.0.1:9081;
	server_name admin.silentflare.com;
	root /opt/silentflare/blog/current;
	index index.html;

	location = / {
		try_files /admin/index.html =404;
	}

	location /admin-api/ {
		proxy_pass http://127.0.0.1:9010/;
		proxy_http_version 1.1;
		proxy_set_header Host api.silentflare.com;
		proxy_set_header X-Real-IP $http_x_real_ip;
		proxy_set_header X-Forwarded-For $http_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
	}

	location / {
		try_files $uri $uri/ /404.html;
	}
}

server {
	listen 127.0.0.1:9081;
	server_name cms.silentflare.com;
	client_max_body_size 50m;
	absolute_redirect off;

	location = / {
		return 302 /ghost/;
	}

	location ^~ /ghost/ {
		proxy_pass http://127.0.0.1:2368;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $http_x_real_ip;
		proxy_set_header X-Forwarded-For $http_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
	}

	location ^~ /content/ {
		proxy_pass http://127.0.0.1:2368;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $http_x_real_ip;
		proxy_set_header X-Forwarded-For $http_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
	}

	location / {
		return 404;
	}
}
