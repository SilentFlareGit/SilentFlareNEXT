# Internal origins. Only Shield and the explicit blog fail-open route use this listener.
server {
	listen 127.0.0.1:9081;
	server_name blog.silentflare.com;
	root /opt/silentflare/blog/current;
	index index.html;
	absolute_redirect off;
	error_page 404 /404.html;

	location / {
		try_files $uri $uri/ =404;
	}

	location = /404.html {
		internal;
	}

	location ~* \.(?:css|js|mjs|json|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?)$ {
		try_files $uri =404;
		access_log off;
		expires 30d;
		add_header Cache-Control "public, max-age=2592000, immutable";
	}
}

server {
	listen 127.0.0.1:9081;
	server_name accounts.silentflare.com;
	root /opt/silentflare/blog/current;
	index index.html;

	location = / {
		try_files /accounts/index.html =404;
	}

	location ~ ^/u/[^/]+/?$ {
		try_files /accounts/index.html =404;
	}

	location /accounts-api/ {
		proxy_pass http://127.0.0.1:9010/;
		proxy_http_version 1.1;
		proxy_set_header Host api.silentflare.com;
		proxy_set_header X-Real-IP $http_x_real_ip;
		proxy_set_header X-Forwarded-For $http_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
	}

	location / {
		try_files $uri $uri/ /404.html;
	}
}

server {
	listen 127.0.0.1:9081;
	server_name admin.silentflare.com;
	root /opt/silentflare/blog/current;
	index index.html;

	location = / {
		try_files /admin/index.html =404;
	}

	location /admin-api/ {
		proxy_pass http://127.0.0.1:9010/;
		proxy_http_version 1.1;
		proxy_set_header Host api.silentflare.com;
		proxy_set_header X-Real-IP $http_x_real_ip;
		proxy_set_header X-Forwarded-For $http_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
	}

	location / {
		try_files $uri $uri/ /404.html;
	}
}

server {
	listen 127.0.0.1:9081;
	server_name cms.silentflare.com;
	client_max_body_size 50m;
	absolute_redirect off;

	location = / {
		return 302 /ghost/;
	}

	location = /_cms_owner_gate {
		internal;
		proxy_pass http://127.0.0.1:9010/auth/cms-gate;
		proxy_http_version 1.1;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
		proxy_set_header Host api.silentflare.com;
		proxy_set_header Cookie $http_cookie;
		proxy_set_header X-Real-IP $http_x_real_ip;
		proxy_set_header X-Forwarded-For $http_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
	}

	location @cms_owner_login {
		add_header Cache-Control "no-store" always;
		return 302 https://auth.silentflare.com/?audience=cms&return_url=https%3A%2F%2Fcms.silentflare.com%2Fghost%2F;
	}

	location ^~ /ghost/api/content/ {
		proxy_pass http://127.0.0.1:2368;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $http_x_real_ip;
		proxy_set_header X-Forwarded-For $http_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
	}

	location ^~ /content/ {
		proxy_pass http://127.0.0.1:2368;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $http_x_real_ip;
		proxy_set_header X-Forwarded-For $http_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
	}

	location ^~ /ghost/ {
		auth_request /_cms_owner_gate;
		error_page 401 = @cms_owner_login;
		error_page 403 = @cms_owner_login;
		proxy_pass http://127.0.0.1:2368;
		proxy_http_version 1.1;
		proxy_set_header Host cms.silentflare.com;
		proxy_set_header X-Real-IP $http_x_real_ip;
		proxy_set_header X-Forwarded-For $http_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	location / {
		return 404;
	}
}

# Emergency Ghost Staff recovery. This TLS listener is loopback-only and must
# be reached through an authenticated SSH tunnel; it is never a Shield upstream.
server {
	listen 127.0.0.1:9443 ssl;
	server_name cms.silentflare.com;
	ssl_certificate /etc/nginx/ssl/silentflare-selfsigned.crt;
	ssl_certificate_key /etc/nginx/ssl/silentflare-selfsigned.key;
	client_max_body_size 50m;
	absolute_redirect off;

	location ^~ /ghost/ {
		proxy_pass http://127.0.0.1:2368;
		proxy_http_version 1.1;
		proxy_set_header Host cms.silentflare.com;
		proxy_set_header X-Real-IP 127.0.0.1;
		proxy_set_header X-Forwarded-For 127.0.0.1;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	location ^~ /content/ {
		proxy_pass http://127.0.0.1:2368;
		proxy_http_version 1.1;
		proxy_set_header Host cms.silentflare.com;
		proxy_set_header X-Real-IP 127.0.0.1;
		proxy_set_header X-Forwarded-For 127.0.0.1;
		proxy_set_header X-Forwarded-Proto https;
	}

	location / {
		return 404;
	}
}
