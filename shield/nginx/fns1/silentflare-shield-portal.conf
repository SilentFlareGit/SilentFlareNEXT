server {
	listen 80;
	listen [::]:80;
	server_name shield.silentflare.com;
	access_log /var/log/nginx/silentflare-shield-portal.access.log;
	error_log /var/log/nginx/silentflare-shield-portal.error.log;
	location / {
		proxy_pass http://127.0.0.1:9083;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name shield.silentflare.com;
	ssl_certificate /etc/nginx/ssl/silentflare-selfsigned.crt;
	ssl_certificate_key /etc/nginx/ssl/silentflare-selfsigned.key;
	access_log /var/log/nginx/silentflare-shield-portal.access.log;
	error_log /var/log/nginx/silentflare-shield-portal.error.log;
	location / {
		proxy_pass http://127.0.0.1:9083;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
