server {
	listen 80;
	listen [::]:80;
	server_name admin.silentflare.com;
	access_log /var/log/nginx/silentflare-admin.access.log;
	error_log /var/log/nginx/silentflare-admin.error.log;
	include /etc/nginx/snippets/silentflare-shield-edge.conf;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name admin.silentflare.com;
	ssl_certificate /etc/nginx/ssl/silentflare-selfsigned.crt;
	ssl_certificate_key /etc/nginx/ssl/silentflare-selfsigned.key;
	access_log /var/log/nginx/silentflare-admin.access.log;
	error_log /var/log/nginx/silentflare-admin.error.log;
	include /etc/nginx/snippets/silentflare-shield-edge.conf;
}
