location = /hooks/rebuild {
	access_log off;
	proxy_pass http://127.0.0.1:9000;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
	proxy_pass http://127.0.0.1:9080;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_connect_timeout 1s;
	proxy_read_timeout 30s;
	proxy_intercept_errors on;
	error_page 502 504 = @shield_blog_fail_open;
}

location @shield_blog_fail_open {
	proxy_pass http://127.0.0.1:9081;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-SF-Shield-Request-ID "";
	proxy_set_header X-SF-Shield-Risk-Score "";
	proxy_set_header X-SF-Shield-Risk-Level "";
	proxy_set_header X-SF-Shield-Action "";
	proxy_set_header X-SF-Shield-Signature "";
}
