# Reference integration. Merge the locations into the existing per-domain files;
# do not replace TLS, Cloudflare real-IP, or static-site configuration blindly.

upstream silentflare_shield {
	server 127.0.0.1:9080;
	keepalive 64;
}

upstream silentflare_blog_origin {
	server 127.0.0.1:4321;
}

upstream silentflare_api_origin {
	server 127.0.0.1:9010;
}

# blog.silentflare.com: public reads may fail open at the Nginx layer.
server {
	listen 443 ssl http2;
	server_name blog.silentflare.com;

	location / {
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
		proxy_pass http://silentflare_shield;
		proxy_connect_timeout 1s;
		proxy_read_timeout 15s;
		proxy_intercept_errors on;
		error_page 502 504 = @blog_fail_open;
	}

	location @blog_fail_open {
		proxy_set_header Host $host;
		proxy_set_header X-SF-Shield-Action "";
		proxy_set_header X-SF-Shield-Signature "";
		proxy_pass http://silentflare_blog_origin;
	}
}

# api.silentflare.com: writes and sensitive endpoints fail closed.
server {
	listen 443 ssl http2;
	server_name api.silentflare.com;

	location / {
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
		proxy_pass http://silentflare_shield;
		proxy_connect_timeout 1s;
		proxy_read_timeout 15s;
	}
}

# Expose the console on a separate protected hostname, preferably behind Cloudflare Access.
server {
	listen 443 ssl http2;
	server_name shield.silentflare.com;

	location / {
		return 404;
	}

	location /__shield/ {
		proxy_set_header Host admin.silentflare.com;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass http://silentflare_shield;
	}
}
