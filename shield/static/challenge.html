<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex,nofollow" />
		<title>Security check | SilentFlare</title>
		<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
		<style>
			:root { font-family: Roboto, system-ui, sans-serif; color: #17243b; background: #edf4f8; }
			body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 1rem; }
			main { width: min(100%, 28rem); padding: 2rem; background: #fff; border: 1px solid #d8e2ea; border-radius: 8px; box-shadow: 0 12px 36px rgb(20 43 67 / 9%); }
			h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
			p { margin: 0 0 1.5rem; color: #607085; line-height: 1.5; }
			#error { margin-top: 1rem; color: #ac2734; }
		</style>
	</head>
	<body>
		<main><h1>Confirm you are human</h1><p>SilentFlare Shield is checking this request before continuing.</p><div class="cf-turnstile" data-sitekey="{{SITE_KEY}}" data-callback="verified"></div><div id="error" role="alert"></div></main>
		<script>
			const returnUrl = {{RETURN_URL}};
			async function verified(token) {
				const response = await fetch("/__shield/challenge/verify", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({token, returnUrl})});
				if (response.ok) location.replace(returnUrl); else document.getElementById("error").textContent = "Verification failed. Please try again.";
			}
		</script>
	</body>
</html>
