services:
  shield:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    command:
      - uvicorn
      - app.main:app
      - --host
      - 127.0.0.1
      - --port
      - "9080"
      - --proxy-headers
      - --forwarded-allow-ips
      - 127.0.0.1
    volumes:
      - shield-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9080/__shield/health/live', timeout=2)
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 15s

volumes:
  shield-data:
