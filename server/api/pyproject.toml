[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501", "E101"]

[tool.ruff.lint.per-file-ignores]
"**/app.py" = ["F401", "F403"]
"**/runtime.py" = ["F401"]
"**/domains/*/router.py" = ["F403", "F405"]
"**/domains/*/service.py" = ["F403", "F405"]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
